services:
  api:
    build: .
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://soraya:soraya123@postgres:5432/soraya?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-change-me-jwt-secret-min-32-chars}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-change-me-refresh-secret-min-32-chars}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - COINGECKO_API_KEY=${COINGECKO_API_KEY:-}
      - NEWS_API_KEY=${NEWS_API_KEY:-}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: soraya
      POSTGRES_PASSWORD: soraya123
      POSTGRES_DB: soraya
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U soraya -d soraya']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  evolution-api:
    image: atendai/evolution-api:latest
    ports:
      - "8080:8080"
    environment:
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - DATABASE_ENABLED=true
      - DATABASE_CONNECTION_URI=${DATABASE_URL}
      - WEBHOOK_GLOBAL_URL=http://api:3000/api/whatsapp/webhook
      - WEBHOOK_GLOBAL_ENABLED=true
    depends_on:
      - postgres
volumes:
  postgres_data:
  redis_data:
