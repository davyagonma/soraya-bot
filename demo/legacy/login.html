<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SORAYA — Connexion</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script src="/demo/assets/js/config.js"></script>
  <script src="/demo/assets/js/auth.js"></script>
  <script src="/demo/assets/js/api.js"></script>
  <script src="/demo/assets/js/utils.js"></script>
  <script src="/demo/assets/js/layout.js"></script>
  <script>document.write(SorayaLayout.headExtras()); SorayaLayout.initTailwind();</script>
</head>
<body class="bg-surface font-body-md text-on-surface min-h-screen flex flex-col">
  <header class="p-gutter">
    <a href="/demo/index.html" class="font-headline-lg text-headline-lg font-bold text-primary">SORAYA</a>
  </header>

  <main class="flex-1 flex items-center justify-center px-gutter py-lg">
    <div class="w-full max-w-md">
      <div class="text-center mb-8">
        <div class="inline-flex items-center gap-2 px-4 py-1 rounded-full bg-primary-fixed text-on-primary-fixed font-label-md text-label-sm mb-4">
          <span class="material-symbols-outlined text-[18px]">lock</span>
          Espace sécurisé
        </div>
        <h1 class="font-headline-lg text-headline-lg text-primary mb-2">Bon retour</h1>
        <p class="text-on-surface-variant">Connectez-vous pour accéder à votre tableau de bord.</p>
      </div>

      <form id="login-form" class="bg-white rounded-2xl p-8 shadow-xl border border-outline-variant/30 space-y-6">
        <div id="error-msg" class="hidden p-4 rounded-xl bg-error-container text-on-error-container text-sm"></div>

        <div>
          <label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-2 block">Email</label>
          <input type="email" name="email" required value="demo@soraya.africa"
            class="w-full rounded-xl border-outline-variant/50 focus:border-primary focus:ring-primary py-3 px-4"/>
        </div>
        <div>
          <label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-2 block">Mot de passe</label>
          <input type="password" name="password" required value="user123456"
            class="w-full rounded-xl border-outline-variant/50 focus:border-primary focus:ring-primary py-3 px-4"/>
        </div>

        <button type="submit" id="submit-btn"
          class="w-full bg-primary text-on-primary py-4 rounded-xl font-headline-md hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
          <span class="material-symbols-outlined">login</span>
          Se connecter
        </button>

        <p class="text-center text-sm text-on-surface-variant">
          Pas encore de compte ?
          <a href="/demo/register.html" class="text-primary font-bold hover:underline">S'inscrire</a>
        </p>
      </form>

      <div class="mt-6 p-4 rounded-xl bg-surface-container-low border border-surface-variant text-sm text-on-surface-variant">
        <p class="font-label-md text-primary mb-2">Comptes démo</p>
        <p><strong>User:</strong> demo@soraya.africa / user123456</p>
        <p><strong>Admin:</strong> admin@soraya.africa / admin123456</p>
      </div>
    </div>
  </main>

  <script>
    SorayaAuth.redirectIfLoggedIn();

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('error-msg');
      errEl.classList.add('hidden');
      const btn = document.getElementById('submit-btn');
      const fd = new FormData(e.target);

      try {
        await SorayaUtils.withLoading(btn, async () => {
          const res = await SorayaAPI.login(fd.get('email'), fd.get('password'));
          SorayaAuth.saveFromAuthResponse(res.data);
        });
        const params = new URLSearchParams(window.location.search);
        const next = params.get('next');
        const user = SorayaAuth.getUser();
        if (next) window.location.href = next;
        else window.location.href = user.role === 'ADMIN' ? '/demo/admin.html' : '/demo/dashboard.html';
      } catch (err) {
        errEl.textContent = err.body?.message || err.message || 'Connexion échouée';
        errEl.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
