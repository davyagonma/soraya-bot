<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SORAYA — Inscription</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script src="/demo/assets/js/config.js"></script>
  <script src="/demo/assets/js/auth.js"></script>
  <script src="/demo/assets/js/api.js"></script>
  <script src="/demo/assets/js/utils.js"></script>
  <script src="/demo/assets/js/layout.js"></script>
  <script>document.write(SorayaLayout.headExtras()); SorayaLayout.initTailwind();</script>
</head>
<body class="bg-surface font-body-md text-on-surface min-h-screen flex flex-col">
  <header class="p-gutter">
    <a href="/demo/index.html" class="font-headline-lg text-headline-lg font-bold text-primary">SORAYA</a>
  </header>

  <main class="flex-1 flex items-center justify-center px-gutter py-lg">
    <div class="w-full max-w-md">
      <div class="text-center mb-8">
        <h1 class="font-headline-lg text-headline-lg text-primary mb-2">Rejoindre SORAYA</h1>
        <p class="text-on-surface-variant">Créez votre compte pour accéder à l'assistant et aux outils crypto.</p>
      </div>

      <form id="register-form" class="bg-white rounded-2xl p-8 shadow-xl border border-outline-variant/30 space-y-6">
        <div id="error-msg" class="hidden p-4 rounded-xl bg-error-container text-on-error-container text-sm"></div>

        <div>
          <label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-2 block">Nom</label>
          <input type="text" name="name" placeholder="Votre nom"
            class="w-full rounded-xl border-outline-variant/50 focus:border-primary focus:ring-primary py-3 px-4"/>
        </div>
        <div>
          <label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-2 block">Email</label>
          <input type="email" name="email" required
            class="w-full rounded-xl border-outline-variant/50 focus:border-primary focus:ring-primary py-3 px-4"/>
        </div>
        <div>
          <label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-2 block">Mot de passe (min. 8 car.)</label>
          <input type="password" name="password" required minlength="8"
            class="w-full rounded-xl border-outline-variant/50 focus:border-primary focus:ring-primary py-3 px-4"/>
        </div>

        <button type="submit" id="submit-btn"
          class="w-full bg-secondary-container text-on-secondary-container py-4 rounded-xl font-headline-md hover:opacity-90 active:scale-[0.98] transition-all">
          Créer mon compte
        </button>

        <p class="text-center text-sm text-on-surface-variant">
          Déjà inscrit ?
          <a href="/demo/login.html" class="text-primary font-bold hover:underline">Se connecter</a>
        </p>
      </form>
    </div>
  </main>

  <script>
    SorayaAuth.redirectIfLoggedIn();

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('error-msg');
      errEl.classList.add('hidden');
      const btn = document.getElementById('submit-btn');
      const fd = new FormData(e.target);

      try {
        await SorayaUtils.withLoading(btn, async () => {
          const res = await SorayaAPI.register(fd.get('email'), fd.get('password'), fd.get('name') || undefined);
          SorayaAuth.saveFromAuthResponse(res.data);
        });
        window.location.href = '/demo/dashboard.html';
      } catch (err) {
        errEl.textContent = err.body?.message || err.message || 'Inscription échouée';
        errEl.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
