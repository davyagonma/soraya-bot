<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SORAYA — Actualités</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/demo/assets/js/config.js"></script>
  <script src="/demo/assets/js/auth.js"></script>
  <script src="/demo/assets/js/api.js"></script>
  <script src="/demo/assets/js/utils.js"></script>
  <script src="/demo/assets/js/layout.js"></script>
  <script>document.write(SorayaLayout.headExtras()); SorayaLayout.initTailwind();</script>
</head>
<body class="bg-background font-body-md text-on-surface overflow-hidden h-screen flex flex-col">
  <div id="app"></div>
  <script>
    document.getElementById('app').innerHTML = `
      ${SorayaLayout.renderTopNav('dashboard', { showSidebar: true })}
      <div class="flex flex-1 overflow-hidden">
        ${SorayaLayout.renderSidebar('news')}
        <main class="flex-1 overflow-y-auto custom-scrollbar">
          <div class="max-w-[900px] mx-auto p-gutter md:p-lg space-y-lg">
            <header>
              <h1 class="font-headline-lg text-headline-lg text-primary">Actualités Crypto</h1>
              <p class="text-on-surface-variant">Dernières nouvelles via GET /api/news</p>
            </header>
            <div id="news-list" class="space-y-4">
              ${[1,2,3].map(() => '<div class="bg-surface-container-lowest p-6 rounded-xl border animate-pulse h-24"></div>').join('')}
            </div>
          </div>
          ${SorayaLayout.renderFooter()}
        </main>
      </div>
    `;

    SorayaAPI.getNews(15).then((res) => {
      const articles = res.data || [];
      document.getElementById('news-list').innerHTML = articles.length ? articles.map((a) => `
        <article class="bg-surface-container-lowest p-6 rounded-xl border border-outline-variant/30 hover:border-primary/30 transition-colors">
          <div class="flex justify-between items-start gap-4 mb-2">
            <h3 class="font-headline-md text-primary">${SorayaUtils.escapeHtml(a.title)}</h3>
            <span class="text-label-sm text-on-surface-variant shrink-0">${SorayaUtils.timeAgo(a.publishedAt)}</span>
          </div>
          <p class="text-on-surface-variant text-sm mb-3">${SorayaUtils.escapeHtml(a.summary)}</p>
          <div class="flex justify-between items-center">
            <span class="text-label-sm text-secondary font-label-md">${SorayaUtils.escapeHtml(a.source)}</span>
            ${a.url ? `<a href="${a.url}" target="_blank" rel="noopener" class="text-primary font-label-md text-sm hover:underline">Lire →</a>` : ''}
          </div>
        </article>
      `).join('') : '<p class="text-on-surface-variant text-center">Aucune actualité disponible.</p>';
    }).catch(() => {
      document.getElementById('news-list').innerHTML = '<p class="text-error">Impossible de charger les actualités.</p>';
    });
  </script>
</body>
</html>
