<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SORAYA — Administration</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/demo/assets/js/config.js"></script>
  <script src="/demo/assets/js/auth.js"></script>
  <script src="/demo/assets/js/api.js"></script>
  <script src="/demo/assets/js/utils.js"></script>
  <script src="/demo/assets/js/layout.js"></script>
  <script>document.write(SorayaLayout.headExtras()); SorayaLayout.initTailwind();</script>
</head>
<body class="bg-background font-body-md text-on-surface overflow-hidden h-screen flex flex-col">
  <div id="app"></div>
  <script>
    if (!SorayaAuth.requireAdmin()) throw new Error('admin');

    const user = SorayaAuth.getUser();

    document.getElementById('app').innerHTML = `
      ${SorayaLayout.renderTopNav('dashboard', { showSidebar: true })}
      <div class="flex flex-1 overflow-hidden">
        ${SorayaLayout.renderSidebar('admin')}
        <main class="flex-1 overflow-y-auto custom-scrollbar">
          <div class="max-w-[1200px] mx-auto p-gutter md:p-lg space-y-lg">
            <header class="flex flex-col md:flex-row md:items-end justify-between gap-4">
              <div>
                <div class="inline-flex items-center gap-2 px-3 py-1 bg-secondary-fixed text-secondary rounded-full mb-2 font-label-sm">
                  <span class="material-symbols-outlined text-[18px]">admin_panel_settings</span> ADMIN
                </div>
                <h1 class="font-headline-lg text-headline-lg text-primary">Tableau de bord administrateur</h1>
                <p class="text-on-surface-variant">Connecté en tant que ${SorayaUtils.escapeHtml(user.email)}</p>
              </div>
              <div id="health-badge" class="flex items-center gap-2 px-4 py-2 rounded-full bg-surface-container-high text-primary font-label-md">
                <span class="material-symbols-outlined text-[18px]">monitor_heart</span> Vérification...
              </div>
            </header>

            <div id="stats-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
              ${['Utilisateurs','Conversations','Alertes','Actualités','Analyses scam'].map((l) => `
                <div class="bg-surface-container-lowest p-6 rounded-xl border border-outline-variant/30">
                  <p class="text-label-sm text-on-surface-variant uppercase mb-2">${l}</p>
                  <p class="font-headline-md text-primary stat-value animate-pulse">—</p>
                </div>
              `).join('')}
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
              <section class="bg-surface-container-lowest rounded-2xl border border-outline-variant/30 overflow-hidden">
                <div class="p-6 border-b border-outline-variant/20">
                  <h3 class="font-headline-md text-primary">Utilisateurs récents</h3>
                </div>
                <div class="overflow-x-auto">
                  <table class="w-full text-left text-sm">
                    <thead><tr class="bg-surface-container-low text-on-surface-variant font-label-md">
                      <th class="px-6 py-3">Email</th><th class="px-6 py-3">Rôle</th><th class="px-6 py-3">Inscrit</th>
                    </tr></thead>
                    <tbody id="users-table" class="divide-y divide-outline-variant/10"></tbody>
                  </table>
                </div>
              </section>

              <section class="bg-surface-container-lowest rounded-2xl border border-outline-variant/30 p-6">
                <h3 class="font-headline-md text-primary mb-4">Marchés (aperçu)</h3>
                <div id="markets-preview" class="space-y-3"></div>
              </section>
            </div>

            <section class="bg-primary-container rounded-2xl p-6 text-on-primary-container">
              <h3 class="font-headline-md text-white mb-4">Outils & documentation</h3>
              <div class="flex flex-wrap gap-4">
                <a href="/api/docs" target="_blank" class="bg-white/10 px-6 py-3 rounded-xl hover:bg-white/20 transition-colors font-label-md">Swagger API</a>
                <a href="/demo/assistant.html" class="bg-white/10 px-6 py-3 rounded-xl hover:bg-white/20 transition-colors font-label-md">Tester le Chat</a>
                <button id="refresh-stats" class="bg-secondary-container text-on-secondary-container px-6 py-3 rounded-xl font-label-md">Rafraîchir</button>
              </div>
              <pre id="dev-info" class="mt-4 text-xs opacity-70 overflow-x-auto"></pre>
            </section>
          </div>
          ${SorayaLayout.renderFooter()}
        </main>
      </div>
    `;

    async function loadAdmin() {
      try {
        const [health, stats, markets] = await Promise.all([
          SorayaAPI.getHealth(),
          SorayaAPI.getAdminStats(),
          SorayaAPI.getMarkets('USD'),
        ]);

        document.getElementById('health-badge').innerHTML = `
          <span class="w-2 h-2 rounded-full bg-on-tertiary-container"></span>
          API ${health.status} · ${new Date(health.timestamp).toLocaleTimeString('fr-FR')}
        `;

        const s = stats.data;
        const values = [s.userCount, s.conversationCount, s.alertCount, s.newsCount, s.scamCount];
        document.querySelectorAll('.stat-value').forEach((el, i) => {
          el.classList.remove('animate-pulse');
          el.textContent = SorayaUtils.formatNumber(values[i], 0);
        });

        document.getElementById('users-table').innerHTML = (s.recentUsers || []).map((u) => `
          <tr class="hover:bg-surface-container-low/50">
            <td class="px-6 py-3">${SorayaUtils.escapeHtml(u.email)}</td>
            <td class="px-6 py-3"><span class="px-2 py-0.5 rounded text-xs ${u.role === 'ADMIN' ? 'bg-secondary-fixed text-secondary' : 'bg-primary-fixed text-primary'}">${u.role}</span></td>
            <td class="px-6 py-3 text-on-surface-variant">${new Date(u.createdAt).toLocaleDateString('fr-FR')}</td>
          </tr>
        `).join('');

        document.getElementById('markets-preview').innerHTML = markets.data.slice(0, 5).map((m) => `
          <div class="flex justify-between items-center p-3 bg-surface-container-low rounded-lg">
            <span class="font-bold text-primary">${m.symbol}</span>
            <span>${SorayaUtils.formatCurrency(m.prices?.USD, 'USD')}</span>
            <span class="${SorayaUtils.percentClass(m.change24h)} text-sm">${SorayaUtils.formatPercent(m.change24h)}</span>
          </div>
        `).join('');
      } catch (err) {
        document.getElementById('health-badge').innerHTML = '<span class="text-error">Erreur API</span>';
        SorayaUtils.showToast(err.message, 'error');
      }

      try {
        const dev = await SorayaAPI.getTestData();
        document.getElementById('dev-info').textContent = JSON.stringify(dev.data, null, 2);
      } catch { /* dev route may be disabled in prod */ }
    }

    document.getElementById('refresh-stats').addEventListener('click', loadAdmin);
    loadAdmin();
  </script>
</body>
</html>
